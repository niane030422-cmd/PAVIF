data:
  train_files: data/train.parquet
  val_files: data/test.parquet
  prompt_key: prompt
  max_prompt_length: 4096
  max_response_length: 8192
  rollout_batch_size: 256
  shuffle: true
  seed: 1
  max_pixels: 4194304
  min_pixels: 262144
  filter_overlong_prompts: True

algorithm:
  adv_estimator: grpo
  kl_coef: 0.0

worker:
  actor:
    global_batch_size: 256
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 4
    max_grad_norm: 1.0
    use_kl_loss: true
    kl_loss_coef: 0.08
    kl_loss_type: low_var_kl
    padding_free: true
    ulysses_sequence_parallel_size: 1
    model:
      model_path: null
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
      max_model_len: 16384
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true

  rollout:
    temperature: 1.0
    n: 5
    gpu_memory_utilization: 0.65
    enforce_eager: false
    enable_chunked_prefill: false
    max_num_batched_tokens : 20480
    tensor_parallel_size: 2
    limit_images: 0
    val_override_config:
      temperature: 0.5
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: function
    compute_score: verification

trainer:
  total_episodes: 15
  logger: ["tensorboard"]
  project_name: instruct
  experiment_name: qwen_stage2
  n_gpus_per_node: 4
  nnodes: 4
  val_freq: 50
  val_before_train: true
  val_only: false
  val_generations_to_log: 1
  save_freq: 50
  remove_previous_ckpt: false
  remove_ckpt_after_load: false
  save_checkpoint_path: null
  load_checkpoint_path: null
  rollout_data_dir: null
